name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Build Docker image and push to GitHub Container Registry ─────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sugarlabs/musicblocks-git-backend:latest
            ghcr.io/sugarlabs/musicblocks-git-backend:${{ github.sha }}

  # ── Job 2: SSH into the VM and pull the new image ───────────────────────────
  deploy:
    needs: build-and-push      # only runs after the image is pushed
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/musicblocks-backend
            docker compose pull
            docker compose up -d --remove-orphans
