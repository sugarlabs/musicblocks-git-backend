name: Build & Deploy

# Triggers on every push to main — including when PR #26 is merged
# into sugarlabs/musicblocks-git-backend.
on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Build Docker image and push to GitHub Container Registry ──────────
  # GITHUB_TOKEN is provided automatically — no secrets needed for this step.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # required to push to ghcr.io/<org>/

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided, no setup needed

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zealot-zew/musicblocks-git-backend:latest
            ghcr.io/zealot-zew/musicblocks-git-backend:${{ github.sha }}

  # ── Job 2: SSH into the VM and redeploy ──────────────────────────────────────
  # Requires three secrets set in sugarlabs/musicblocks-git-backend repo settings:
  #   DEPLOY_HOST     → containers.sugarlabs.org
  #   DEPLOY_USER     → zealot
  #   DEPLOY_SSH_KEY  → contents of the zealot private key (~/.ssh/id_ed25519)
  #
  # Until the secrets are configured this job will be skipped (if: condition).
  # The container on the VM keeps running unaffected.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # NOTE: This job requires 3 secrets to be configured in the repo settings:
    #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
    # Until they are set, this job will fail (build-and-push above still succeeds).

    steps:
      - name: Deploy to containers.sugarlabs.org
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/zealot/musicblocks-git-backend

            # Pull the freshly-built image from GHCR (zealot-zew personal registry)
            docker compose pull

            # Replace the running container with zero-downtime rolling restart
            docker compose up -d --remove-orphans

            # Confirm the new container is healthy
            sleep 10
            docker compose ps
            curl -sf http://127.0.0.1:5001/health || exit 1
            echo "Deploy successful"
