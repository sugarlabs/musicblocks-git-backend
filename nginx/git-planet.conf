##
## nginx site config — musicblocks git-backend
## Subdomain: git-planet.sugarlabs.org
## Proxies to Docker container on 127.0.0.1:5001
##
## Deploy:
##   sudo cp nginx/git-planet.conf /etc/nginx/sites-available/git-planet
##   sudo ln -s /etc/nginx/sites-available/git-planet /etc/nginx/sites-enabled/git-planet
##   sudo nginx -t && sudo systemctl reload nginx
##
## TLS: your mentor will run certbot after DNS is live.
##

server {
    listen 80;
    listen [::]:80;
    server_name git-planet.sugarlabs.org;

    # Logs
    access_log /var/log/nginx/git-planet.access.log;
    error_log  /var/log/nginx/git-planet.error.log warn;

    # Increase body size limit to match Express (10mb JSON payloads)
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Standard proxy headers — Express reads X-Forwarded-* when TRUST_PROXY=1
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive for persistent connections
        proxy_set_header   Connection        "";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # Health check shortcut — returns quickly without hitting Node
    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
